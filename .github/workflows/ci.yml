name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Docs — links, section pointers, rule IDs, frontmatter, version
        run: python scripts/check_docs.py
      - name: QA gate self-test
        run: python scripts/test_qa.py
